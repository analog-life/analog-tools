<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Schematic Editor · Analog Tools</title>
<meta name="description" content="在浏览器中绘制电路原理图、管理子图、生成网表和导出图像。">
<script>
if (!location.pathname.endsWith("/") && !/\.[^/]*$/.test(location.pathname)) {
  const base = document.createElement("base");
  base.href = location.pathname + "/";
  document.head.append(base);
}
</script>
<script src="./editor-preferences.js"></script>
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="modulepreload" crossorigin href="./assets/jointjs-CXOFuMno.js">
<link rel="stylesheet" crossorigin href="./assets/editor-DZWzNIj3.css">
<link rel="stylesheet" crossorigin href="./assets/style-BOiV29gy.css">
<link rel="stylesheet" href="./schematic.css">
<script type="module" crossorigin src="./assets/editor-Cv8yLXDW.js"></script>
</head>
<body class="schematic-page app-page" data-schematic-version="1.0.0-beta">
<header class="schematic-site-heading" id="schematic-site-heading">
  <a class="back" href="../" lang="zh-CN">← 返回工具列表</a>
  <span class="header-divider" aria-hidden="true"></span>
  <h1 class="app-title">Schematic Editor</h1>
</header>
<div id="app"></div>
<footer class="site-footer app-footer" lang="zh-CN">
  <div class="wrap">
    <p class="footer-credit">基于开源项目 <a href="https://github.com/KingsAnalog/GmKing-schematic-editor" target="_blank" rel="noopener">GmKing Schematic Editor</a>（MIT 许可）· 原作者 RarityBrown · 绘制内容仅保存在本浏览器，不会上传。</p>
    <p class="footer-meta">
      <span>© 2026 Analog Life</span>
      <span class="beian-sep" aria-hidden="true">·</span>
      <span class="beian">
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">鲁ICP备2022011627号-1</a>
        <span class="beian-sep" aria-hidden="true">·</span>
        <a href="https://www.beian.gov.cn/portal/registerSystemInfo?recordcode=61010302000906" target="_blank" rel="noopener">陕公网安备61010302000906号</a>
      </span>
    </p>
  </div>
</footer>
<script type="module">
const app = document.getElementById("app");
const header = document.getElementById("schematic-site-heading");
const shell = app.querySelector("[data-schematic-shell]");
if (shell) {
  const sidebar = shell.querySelector("[data-schematic-palette]");
  sidebar.querySelector(".schematic-sidebar-heading").remove();
  shell.querySelector("[data-schematic-help]").href = "https://www.analog-life.com/tools/schematic/manual.html";
  const fallbackLanguage = document.documentElement.dataset.siteLanguageFallback;
  if (fallbackLanguage) {
    const languageSelect = shell.querySelector("[data-schematic-language-select]");
    languageSelect.value = fallbackLanguage;
    languageSelect.dispatchEvent(new Event("change", { bubbles: true }));
  }

  function placeHeading() {
    const inSidebar = shell.classList.contains("is-left-panel-visible") && !shell.classList.contains("is-layout-narrow");
    if (inSidebar && header.parentElement !== sidebar) sidebar.prepend(header);
    if (!inSidebar && header.parentElement === sidebar) app.before(header);
  }
  placeHeading();
  new MutationObserver(placeHeading).observe(shell, { attributes: true, attributeFilter: ["class"] });
}
</script>
</body>
</html>
